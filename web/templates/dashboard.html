{% extends "base.html" %}

{% block content %}
    <style>
        /* Немного переопределим стили для дашборда, чтобы карточка была шире */
        .card { max-width: 600px; }
        .stats-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 20px; }
        .stat-box { background: #e9ecef; padding: 20px; border-radius: 8px; text-align: center; }
        .stat-box h3 { margin: 0; color: #495057; font-size: 16px; }
        .stat-box p { margin: 10px 0 0; font-size: 32px; font-weight: bold; color: #007bff; }
    </style>

    <h2>Дашборд администратора</h2>
    
    <div class="stats-grid">
        <div class="stat-box">
            <h3>Пользователи</h3>
            <p>{{ users_count }}</p>
        </div>
        <div class="stat-box">
            <h3>Записи</h3>
            <p>{{ bookings_count }}</p>
        </div>
    </div>

    <div style="text-align: center; margin-top: 20px;">
        <a href="/" style="color: #dc3545; text-decoration: none;">Выйти</a>
    </div>
{% endblock %}
